<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de precios</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f7a4d">
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #1d2320; --muted: #66706a;
    --line: #e2e6df; --accent: #1f7a4d; --accent-ink: #ffffff;
    --best: #e5f4ea; --warn: #b4551d; --bad: #a33a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --card: #1d2320; --ink: #eceee9; --muted: #98a39c;
      --line: #2c3530; --accent: #4cc38a; --accent-ink: #0d1a13;
      --best: #1c3a2a; --warn: #e08a52; --bad: #e07a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 4px 0 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search] {
    flex: 1 1 220px; padding: 12px 14px; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    padding: 12px 16px; font-size: 1rem; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .hint { color: var(--muted); font-size: .875rem; margin: 8px 2px 0; }
  #scanner { display: none; margin-top: 12px; }
  #scanner video { width: 100%; max-height: 320px; background: #000; border-radius: 12px; object-fit: cover; }
  #status { margin: 16px 2px; color: var(--muted); }
  .product {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin: 12px 0;
  }
  .head { display: flex; gap: 12px; align-items: center; }
  .head img { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; background: #fff; }
  .head .ph { width: 64px; height: 64px; border-radius: 8px; background: var(--line); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: .8125rem; }
  .save { margin-left: auto; text-align: right; font-size: .8125rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  td.price { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  td.unit { text-align: right; color: var(--muted); font-size: .8125rem; white-space: nowrap; }
  tr.best td { background: var(--best); }
  tr.best td:first-child { border-radius: 8px 0 0 8px; }
  tr.best td:last-child { border-radius: 0 8px 8px 0; }
  tr.out td { color: var(--muted); }
  .tag { font-size: .6875rem; padding: 2px 6px; border-radius: 6px; margin-left: 6px; background: var(--accent); color: var(--accent-ink); }
  .tag.out { background: var(--line); color: var(--muted); }
  .old { text-decoration: line-through; color: var(--muted); font-size: .75rem; margin-right: 6px; }
  a { color: inherit; }
  .errs { color: var(--warn); font-size: .8125rem; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Comparador de precios de supermercados</h1>

  <form id="form">
    <input id="q" type="search" placeholder="Nombre o código de barras (ej. 7790070410123)" autocomplete="off" inputmode="search">
    <button class="primary" type="submit" id="go">Buscar</button>
    <button type="button" id="scan">Escanear</button>
  </form>
  <p class="hint">Si pegás un código de barras (8, 12, 13 o 14 dígitos) se busca el producto exacto en cada tienda.</p>

  <div id="scanner">
    <video id="video" playsinline muted></video>
    <p class="hint" id="scanmsg">Apuntá la cámara al código de barras.</p>
    <button type="button" id="stop">Cerrar cámara</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>
  <div id="errs" class="errs"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 2 }).format(n);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function runSearch(q) {
  q = q.trim();
  if (q.length < 2) return;
  $("go").disabled = true;
  $("status").textContent = "Buscando en los supermercados…";
  $("results").innerHTML = ""; $("errs").textContent = "";
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Error al buscar");
    render(data);
  } catch (e) {
    $("status").textContent = "No se pudo buscar: " + e.message;
  } finally {
    $("go").disabled = false;
  }
}

function render(d) {
  const ok = d.stores.filter((s) => s.ok).length;
  const failed = d.stores.filter((s) => !s.ok);
  if (!d.products.length) {
    $("status").textContent = ok
      ? "No encontré resultados para “" + d.query + "”."
      : "Ninguna tienda respondió. Revisá tu conexión.";
  } else {
    $("status").textContent = d.products.length + " producto(s) · " + ok + " de " + d.stores.length + " tiendas respondieron" +
      (d.mode === "ean" ? " · búsqueda por código de barras" : "");
  }
  $("results").innerHTML = d.products.map((p) => {
    const rows = p.offers.map((o, i) => {
      const best = o.in_stock && o.store === p.best_store && i === 0 && p.offers.filter(x => x.in_stock).length > 0;
      const up = o.unit_price ? money(o.unit_price.value) + "/" + o.unit_price.per : "";
      const old = o.list_price > o.price ? '<span class="old">' + money(o.list_price) + "</span>" : "";
      return '<tr class="' + (best ? "best" : "") + (o.in_stock ? "" : " out") + '">' +
        '<td><a href="' + esc(o.url) + '" target="_blank" rel="noopener">' + esc(o.store) + "</a>" +
        (best ? '<span class="tag">Más barato</span>' : "") +
        (o.in_stock ? "" : '<span class="tag out">Sin stock</span>') + "</td>" +
        '<td class="unit">' + up + "</td>" +
        '<td class="price">' + old + money(o.price) + "</td></tr>";
    }).join("");
    return '<section class="product"><div class="head">' +
      (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy">' : '<div class="ph"></div>') +
      '<div><div class="name">' + esc(p.name) + '</div><div class="meta">' +
      esc([p.brand, p.ean && "EAN " + p.ean].filter(Boolean).join(" · ")) + "</div></div>" +
      (p.savings_pct > 0 ? '<div class="save">Ahorrás hasta ' + p.savings_pct + "%</div>" : "") +
      "</div><table>" + rows + "</table></section>";
  }).join("");
  $("errs").textContent = failed.length ? "Sin respuesta: " + failed.map((s) => s.store).join(", ") : "";
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); runSearch($("q").value); });

// ---- escáner de código de barras (BarcodeDetector: Chrome/Android, Edge, Safari reciente) ----
let stream = null, timer = null;
function stopScan() {
  clearInterval(timer); timer = null;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; $("scanner").style.display = "none";
}
$("stop").addEventListener("click", stopScan);
$("scan").addEventListener("click", async () => {
  if (!("BarcodeDetector" in window)) {
    $("status").textContent = "Este navegador no soporta escaneo. Escribí el código a mano o probá con Chrome en el celular.";
    return;
  }
  if (!window.isSecureContext) {
    $("status").textContent = "La cámara solo funciona en https o en localhost.";
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    $("status").textContent = "No pude acceder a la cámara: " + e.message;
    return;
  }
  const video = $("video");
  video.srcObject = stream; await video.play();
  $("scanner").style.display = "block";
  const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "itf"] });
  timer = setInterval(async () => {
    try {
      const codes = await detector.detect(video);
      if (codes.length) {
        const value = codes[0].rawValue;
        stopScan();
        $("q").value = value;
        runSearch(value);
      }
    } catch (_) { /* frame no listo */ }
  }, 300);
});
</script>
</body>
</html>
